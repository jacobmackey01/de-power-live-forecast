name: integrity

# The load-bearing check. Everything this project claims rests on sealed
# predictions being immutable, so that property is enforced in CI rather than
# left to discipline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  predictions-are-write-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject modification or deletion of sealed predictions
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # First push to a branch reports an all-zero "before" ref.
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "New branch; no prior state to compare against."
              exit 0
            fi
          fi

          echo "Comparing $BASE..$HEAD"
          CHANGED=$(git diff --diff-filter=MD --name-only "$BASE" "$HEAD" -- predictions/ || true)

          if [ -n "$CHANGED" ]; then
            echo "::error::Sealed predictions were modified or deleted:"
            echo "$CHANGED"
            echo ""
            echo "predictions/ is write-once. A sealed forecast may never be edited"
            echo "after the fact - that is the entire basis of this record."
            exit 1
          fi
          echo "OK: no sealed prediction was modified or deleted."

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q
