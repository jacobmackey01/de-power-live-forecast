name: predict

# Seals tomorrow's forecast before the day-ahead gate closes.
#
# Timing: the gate is 12:00 Europe/Berlin, which is 10:00 UTC in summer (CEST)
# and 11:00 UTC in winter (CET). Summer is the binding case.
#
# Scheduled Actions are queued, not guaranteed, and the delay on this repository
# has been growing all window: roughly 1h through early August, 4h30 to 12h over
# 2026-08-27..09-03 (which is why the record has a run of missed days), and a
# steady 4h26 to 5h03 since. Moving the cron to "12 3" bought slack, but the
# queue has already eaten most of it again - the 2026-09-08 seal landed with
# 103 minutes to spare.
#
# Simply moving the cron earlier again does not fix this, and is not free. The
# seal hour is a methodological choice, not just an operational one, and the
# reasoning is set out in full in docs/seal-timing.md. In short: forward drivers
# are Open-Meteo NWP whose 00Z run lands around 03:00-04:00 UTC, and the frozen
# model was fit at SEAL_LOCAL_HOUR, 11:00 Europe/Berlin, so three of its inputs
# shift as the live seal moves away from that hour.
#
# So the cron moves to 02:12 UTC to get clear of the queue, and the job then
# waits until a fixed local seal window before it seals. Start time and seal
# time are thereby decoupled: a punctual run sleeps until the window, a run
# delayed past the window seals immediately, and only a run delayed past the
# gate misses - which now takes nearly eight hours of queue delay.
#
# This buys reliability, not accuracy. It does not make any forecast better; it
# makes it likelier that a forecast exists at all. See docs/seal-timing.md.
#
# predict.py independently refuses to seal after gate closure, so a badly
# delayed run still fails loudly instead of writing a worthless late forecast.
# Nothing here relaxes that guard, and nothing here can seal a second time:
# seal() is write-once, and the guard step below refuses to run over a day that
# is already sealed or already in the ledger.

on:
  schedule:
    - cron: "12 2 * * *"
  workflow_dispatch:
    inputs:
      skip_wait:
        description: "Seal immediately instead of waiting for the seal window"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: predict
  cancel-in-progress: false

env:
  # Anchored in local market time so it holds its distance from both the gate
  # and the training cutoff across the October DST change.
  SEAL_WINDOW_LOCAL: "07:30"

jobs:
  seal:
    runs-on: ubuntu-latest
    # Covers the longest possible wait (winter, punctual start) plus the run
    # itself, and stays well inside the 6h job ceiling.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip && pip install -e .

      # Decides whether the day still needs sealing. Crucially it does not infer
      # a seal from a filename: a truncated, partial or mismatched file is
      # reported as invalid and fails the run rather than being mistaken for
      # success, which would exit green with neither a forecast nor a MISSED row
      # and quietly drop the day out of the record. See seal_guard.py.
      - name: Check whether tomorrow still needs sealing
        id: guard
        run: |
          set -o pipefail
          TARGET=$(TZ=Europe/Berlin date -d tomorrow +%Y-%m-%d)
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          python -m de_power_live.seal_guard "$TARGET" \
            | tee "$RUNNER_TEMP/guard.out"
          grep -E '^skip=(true|false)$' "$RUNNER_TEMP/guard.out" >> "$GITHUB_OUTPUT"

      # The window never crosses local midnight, so the delivery date computed
      # above still holds after the wait. Manual runs skip the wait by default,
      # since dispatch is the emergency path used when the queue has already
      # eaten the morning; pass skip_wait=false to rehearse the scheduled path.
      - name: Wait for the seal window
        if: steps.guard.outputs.skip == 'false' && github.event.inputs.skip_wait != 'true'
        run: |
          WINDOW=$(TZ=Europe/Berlin date -d "today $SEAL_WINDOW_LOCAL" +%s)
          NOW=$(date +%s)
          WAIT=$(( WINDOW - NOW ))
          if [ "$WAIT" -le 0 ]; then
            echo "Already past $SEAL_WINDOW_LOCAL Europe/Berlin; sealing now."
            exit 0
          fi
          echo "Sleeping ${WAIT}s until $SEAL_WINDOW_LOCAL Europe/Berlin."
          sleep "$WAIT"

      - name: Seal tomorrow's forecast
        id: seal
        if: steps.guard.outputs.skip == 'false'
        run: python -m de_power_live.predict

      - name: Record a miss if sealing failed
        id: miss
        if: failure() && steps.seal.outcome == 'failure'
        run: |
          TARGET=$(TZ=Europe/Berlin date -d tomorrow +%Y-%m-%d)
          python -m de_power_live.score --record-miss "$TARGET" \
            --reason "predict job failed in run ${{ github.run_id }}"

      - name: Generate track-record figure for a missed forecast
        id: figure
        if: always() && steps.miss.outcome == 'success'
        run: python -m de_power_live.track_record

      - name: Commit
        if: always() && (steps.seal.outcome == 'success' || steps.figure.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain predictions results)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git add predictions results
          if [ "${{ steps.seal.outcome }}" = "success" ]; then
            git commit -m "Seal forecast $(TZ=Europe/Berlin date -d tomorrow +%Y-%m-%d)

            Sealed by scheduled run ${{ github.run_id }} before gate closure."
          else
            git commit -m "Record missed forecast $(TZ=Europe/Berlin date -d tomorrow +%Y-%m-%d)

            No forecast was sealed before gate closure; the MISSED ledger record is authoritative."
          fi
          git push
