name: predict

# Seals tomorrow's forecast before the day-ahead gate closes.
#
# Timing: the gate is 12:00 Europe/Berlin, which is 10:00 UTC in summer (CEST)
# and 11:00 UTC in winter (CET). Summer is the binding case.
#
# Scheduled Actions are queued, not guaranteed, and on-the-hour crons sit in the
# most contended slot on the platform. At "0 6" every run from 2026-08-27 onward
# started between 4h30 and 12h late and so arrived after the gate, which is why
# the record has a run of missed days. This runs at 03:12 UTC instead: off the
# hour, and roughly 6h45 of slack against the tighter summer deadline.
#
# Sealing earlier costs no forecast quality. PREREGISTRATION.md section 2 bans
# the SMARD D+1 forecast series outright, so waiting until mid-morning buys no
# extra information; the only timing constraint the pre-registration imposes is
# that the seal timestamp falls before 12:00 Europe/Berlin, and every sealed
# file records its own minutes_before_close, so the change is auditable.
#
# predict.py independently refuses to seal after gate closure, so a badly
# delayed run still fails loudly instead of writing a worthless late forecast.

on:
  schedule:
    - cron: "12 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip && pip install -e .

      - name: Seal tomorrow's forecast
        id: seal
        run: python -m de_power_live.predict

      - name: Record a miss if sealing failed
        id: miss
        if: failure() && steps.seal.outcome == 'failure'
        run: |
          TARGET=$(TZ=Europe/Berlin date -d tomorrow +%Y-%m-%d)
          python -m de_power_live.score --record-miss "$TARGET" \
            --reason "predict job failed in run ${{ github.run_id }}"

      - name: Generate track-record figure for a missed forecast
        id: figure
        if: always() && steps.miss.outcome == 'success'
        run: python -m de_power_live.track_record

      - name: Commit
        if: always() && (steps.seal.outcome == 'success' || steps.figure.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain predictions results)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git add predictions results
          if [ "${{ steps.seal.outcome }}" = "success" ]; then
            git commit -m "Seal forecast $(TZ=Europe/Berlin date -d tomorrow +%Y-%m-%d)

            Sealed by scheduled run ${{ github.run_id }} before gate closure."
          else
            git commit -m "Record missed forecast $(TZ=Europe/Berlin date -d tomorrow +%Y-%m-%d)

            No forecast was sealed before gate closure; the MISSED ledger record is authoritative."
          fi
          git push
