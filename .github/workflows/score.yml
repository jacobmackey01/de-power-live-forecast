name: score

# Scores delivery days whose outturn has settled, and appends to results/.
# Never writes to predictions/ - the integrity workflow would reject it if it did.
#
# Runs late enough that the previous delivery day is fully settled, allowing for
# the 30-hour settle margin in score.py.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip && pip install -e .

      # Retried for the same reason as the seal step in predict.yml: SMARD can
      # drop a connection without replying (it did on 2026-10-27), and smard.py
      # sits inside the frozen model hash. A retry appends nothing twice, since
      # score.py skips every day already in the ledger.
      - name: Score settled predictions
        run: |
          for attempt in 1 2 3; do
            if python -m de_power_live.score; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 5 minutes."
              sleep 300
            fi
          done
          exit 1

      - name: Generate deterministic track-record figure
        run: python -m de_power_live.track_record

      # Writes results/FINAL_REPORT.md once every window day is SCORED or
      # MISSED, and nothing before. Deterministic, so later runs rewrite the
      # same bytes and the commit step below finds nothing to commit. A failure
      # here is flagged on the run but must never hold back the day's scores.
      - name: Final assessment of the evaluation window
        continue-on-error: true
        run: python -m de_power_live.final_report

      # This workflow has no push trigger, so the derived SVG commit cannot loop.
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain results)" ]; then
            echo "nothing new to score"
            exit 0
          fi
          git add results
          git commit -m "Score settled delivery days (run ${{ github.run_id }})"
          git push
